[project]
name = "github-overlord"
version = "0.9.0"
description = "Automatically merge Dependabot PRs in public repositories"
authors = [{ name = "Michael Bianco", email = "mike@mikebian.co" }]
readme = "README.md"
keywords = ["github", "dependabot", "automation"]
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pygithub>=2.4.0",
    "click>=8.1.7",
    "python-decouple-typed>=3.11.0",
    "funcy-pipe>=0.11.1,<0.15.0",
    "structlog>=24.4,<27.0",
    "apscheduler>=3.10.4",
    "openai>=1.52.2,<4.0.0",
    "pydantic-ai-slim[google]>=0.0.18",
    "jinja2>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/iloveitaly/github-overlord"
Repository = "https://github.com/iloveitaly/github-overlord"

[project.scripts]
github-overlord = "github_overlord:cli"

[build-system]
requires = ["uv_build>=0.11.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# avoids the src/ directory structure
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pyright[nodejs]>=1.1.408",
    "ruff>=0.15.0",
    "coverage>=7.13.4",
    "pytest-cov>=7.0.0",
    "covdefaults>=2.3.0",
    "beautiful-traceback>=0.2.0",
    "djlint>=1.36.4",
]

[tool.pyright]
exclude = ["examples/", "playground/", "playground.py", "tmp/", ".venv/", "tests/"]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing --cov-report=html:tmp/htmlcov"

[tool.coverage.run]
plugins = ["covdefaults"]
source = ["github_overlord"]

[tool.coverage.report]
fail_under = 10
